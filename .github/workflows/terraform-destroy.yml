# 수동 실행 전용: live/ 리소스 전체 삭제 (production 승인 필요)
name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '삭제하려면 destroy 를 입력'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-live
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: destroy
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform destroy -input=false -no-color -auto-approve -lock-timeout=120s
