# main에 병합되면 production 환경 승인을 기다렸다가 apply 한다
name: terraform-apply

on:
  push:
    branches: [main]
    paths: ["live/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-live
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production    # Settings → Environments 의 승인자 승인 후 시작
    defaults:
      run:
        working-directory: live
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: init · plan · apply
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
          terraform apply -input=false -no-color tfplan
          terraform output -no-color
