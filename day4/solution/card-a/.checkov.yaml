# Checkov 설정 — 이 폴더에서 checkov -d . 를 실행하면 자동으로 읽는다
# skip-check는 "실습 환경이라 일부러 두는 예외"만. 줄마다 이유를 남긴다.
# 운영 환경이라면 아래 항목도 모두 고쳐야 한다.
framework:
  - terraform
skip-check:
  # HTTPS — 실습 계정에 도메인·인증서가 없어 HTTP 80만 사용
  - CKV_AWS_2
  - CKV_AWS_103
  - CKV_AWS_378
  - CKV2_AWS_20
  # 비용 — WAF, VPC 흐름 로그, ALB 액세스 로그, RDS 향상된 모니터링·로그, Multi-AZ
  - CKV2_AWS_28
  - CKV2_AWS_11
  - CKV_AWS_91
  - CKV_AWS_118
  - CKV_AWS_129
  - CKV_AWS_157
  # 정리 — 수업 끝에 바로 삭제해야 하므로 삭제 보호를 끔
  - CKV_AWS_150
  - CKV_AWS_293
  # 범위 밖 — RDS IAM 인증, AZ ID 고정
  - CKV_AWS_161
  - CKV_AWS_394
  # ---- 카드 A (정적 웹사이트) 실습 예외
  # 도메인이 없어 CloudFront 기본 인증서 사용 — 사용자 인증서·TLS 최소 버전 지정 불가
  - CKV2_AWS_42
  - CKV_AWS_174
  # 비용 — WAF, KMS 고객 관리 키, 접근 로그용 버킷, 교차 리전 복제, 이벤트 알림
  - CKV_AWS_68
  - CKV2_AWS_47
  - CKV_AWS_145
  - CKV_AWS_18
  - CKV_AWS_86
  - CKV_AWS_144
  - CKV2_AWS_62
  # 범위 밖 — 오리진 장애 조치(두 번째 버킷), 국가별 접근 제한(전 세계 공개 목적)
  - CKV_AWS_310
  - CKV_AWS_374
