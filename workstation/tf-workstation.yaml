AWSTemplateFormatVersion: "2010-09-09"
Description: Terraform·AI 실습용 작업 서버. 브라우저 VS Code(code-server, 8080)는 내 IP에서만 접속, AWS 인증은 IAM 역할.

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.small
  MyIpCidr:
    Type: String
    Description: 내 PC의 공인 IP 뒤에 /32 (예 203.0.113.10/32). 브라우저 VS Code(8080)를 이 주소에만 연다.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/32$
    ConstraintDescription: IPv4 주소 뒤에 /32를 붙여 입력
  CodeServerPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: 브라우저 VS Code 접속 비밀번호 (8자 이상, 다른 곳에서 쓰지 않는 값)

Resources:
  WorkstationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub tf-workstation-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      # Terraform이 VPC·EC2·RDS·IAM(OIDC 역할)까지 만들므로 실습 계정 안에서 관리자 권한을 준다
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - { Key: Course, Value: "04" }
        - { Key: Role, Value: workstation }

  WorkstationProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkstationRole]

  WorkstationSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: tf-workstation - code-server from my IP only
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: !Ref MyIpCidr, Description: code-server }
      Tags:
        - { Key: Name, Value: tf-workstation-sg }
        - { Key: Course, Value: "04" }
        - { Key: Role, Value: workstation }

  WorkstationLT:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions: { HttpTokens: required }

  Workstation:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref WorkstationProfile
      SecurityGroupIds: [!GetAtt WorkstationSG.GroupId]
      LaunchTemplate:
        LaunchTemplateId: !Ref WorkstationLT
        Version: !GetAtt WorkstationLT.LatestVersionNumber
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true }
      Tags:
        - { Key: Name, Value: tf-workstation }
        - { Key: Course, Value: "04" }
        - { Key: Role, Value: workstation }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y git jq unzip python3-pip dnf-plugins-core
          # Terraform 1.17.x (HashiCorp 공식 저장소)
          dnf config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
          dnf install -y 'terraform-1.17.*'
          # tflint
          TL=$(curl -fsSL https://api.github.com/repos/terraform-linters/tflint/releases/latest | jq -r .tag_name)
          curl -fsSL -o /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/download/$TL/tflint_linux_amd64.zip
          unzip -o -q /tmp/tflint.zip -d /usr/local/bin
          # Checkov (전용 가상환경)
          python3 -m venv /opt/checkov && /opt/checkov/bin/pip install -q checkov && ln -sf /opt/checkov/bin/checkov /usr/local/bin/checkov
          # Trivy
          TV=$(curl -fsSL https://api.github.com/repos/aquasecurity/trivy/releases/latest | jq -r .tag_name | tr -d v)
          dnf install -y https://github.com/aquasecurity/trivy/releases/download/v$TV/trivy_${!TV}_Linux-64bit.rpm
          # code-server (브라우저 VS Code)
          CV=$(curl -fsSL https://api.github.com/repos/coder/code-server/releases/latest | jq -r .tag_name | tr -d v)
          dnf install -y https://github.com/coder/code-server/releases/download/v$CV/code-server-${!CV}-amd64.rpm
          mkdir -p /home/ec2-user/.config/code-server
          cat > /home/ec2-user/.config/code-server/config.yaml <<'CFG'
          bind-addr: 0.0.0.0:8080
          auth: password
          password: ${CodeServerPassword}
          cert: false
          CFG
          echo 'export AWS_REGION=${AWS::Region} AWS_DEFAULT_REGION=${AWS::Region}' > /etc/profile.d/aws-region.sh
          chown -R ec2-user:ec2-user /home/ec2-user/.config
          systemctl enable --now code-server@ec2-user
          sudo -u ec2-user code-server --install-extension hashicorp.terraform || true
          echo done > /var/tmp/workstation-ready

Outputs:
  InstanceId:
    Value: !Ref Workstation
  VSCodeUrl:
    Value: !Sub http://${Workstation.PublicIp}:8080
    Description: 브라우저 VS Code 주소 (서버를 중지 후 다시 시작하면 IP가 바뀌므로 EC2 콘솔에서 확인)
